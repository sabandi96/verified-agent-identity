name: Multi Agent Generator + Link
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'emetzoro'
        required: true
        type: string

jobs:
  create-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run:  |
          npm install ethers@6
          if [ -f package.json ]; then npm install; fi

      - name: Step 1 - Generate Wallet Baru
        id: wallet
        run:  |
          node -e "
          const { Wallet } = require('ethers');
          const fs = require('fs');
          const wallet = Wallet.createRandom();
          
          const data = {
            agentName: '${{ github.event.inputs.agent_name }}',
            address: wallet.address,
            privateKey: wallet.privateKey,
            mnemonic: wallet.mnemonic.phrase
          };
          
          fs.writeFileSync('wallet.json', JSON.stringify(data, null, 2));
          
          console.log('=== BACKUP INI SEKARANG ===');
          console.log('Agent Name:', data.agentName);
          console.log('Address:', data.address);
          console.log('Private Key:', data.privateKey);
          console.log('Mnemonic:', data.mnemonic);
          console.log('=== BACKUP INI SEKARANG ===');
          
          fs.writeFileSync(process.env.GITHUB_OUTPUT, \`address=\${wallet.address}\\n\`);
          "

      - name: Step 2 - Upload Wallet File
        uses: actions/upload-artifact@v4
        with:
          name: wallet-${{ github.event.inputs.agent_name }}-${{ github.run_number }}
          path: wallet.json
          retention-days: 7

      - name: Step 3 - Install ClawHub Skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Step 4 - Link Human to Agent
        run:  |
          echo "Address wallet: ${{ steps.wallet.outputs.address }}"
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_name }} AI Agent"}'
          
          echo ""
          echo "=== KALAU BERHASIL ==="
          echo "Klik link yang muncul di atas buat verify"
          echo "=== KALAU GAGAL ==="
          echo "Copy Address: ${{ steps.wallet.outputs.address }}"
          echo "Verify manual di https://billions.network"
