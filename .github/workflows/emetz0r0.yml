name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Nama agent baru, harus unik tiap Run'
        required: true
        type: string

jobs:
  generate-wallet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies + iden3
        run: |
          npm install ethers@6
          npm install @iden3/js-iden3-auth
          npm install

      - name: Step 1 - Generate Wallet + Print PK
        id: wallet
        run: |
          node -e "
          const { Wallet } = require('ethers');
          const fs = require('fs');
          const wallet = Wallet.createRandom();
          
          const output = 'Agent Name: ${{ github.event.inputs.agent_name }}\n' +
          'Address: ' + wallet.address + '\n' +
          'Private Key: ' + wallet.privateKey + '\n' +
          'Mnemonic: ' + wallet.mnemonic.phrase;
          
          fs.writeFileSync('wallet.txt', output);
          fs.writeFileSync(process.env.GITHUB_OUTPUT, 'address=' + wallet.address);
          
          console.log('=== BACKUP INI WAJIB ===');
          console.log(output);
          console.log('=== BACKUP INI WAJIB ===');
          "

      - name: Step 2 - Upload Wallet File
        uses: actions/upload-artifact@v4
        with:
          name: wallet-${{ github.event.inputs.agent_name }}
          path: wallet.txt

      - name: Step 3 - Try Link Human
        continue-on-error: true
        run: |
          echo "=== MULAI LINK HUMAN ==="
          echo "Address: ${{ steps.wallet.outputs.address }}"
          
          if [ -f "scripts/manualLinkHumanToAgent.js" ]; then
            node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_name }} AI Agent"}'
            echo "=== KALAU SUKSES, KLIK LINK DI ATAS ==="
          else
            echo "=== SCRIPT TIDAK ADA ==="
            echo "Verify manual: https://billions.network"
            echo "Paste Address: ${{ steps.wallet.outputs.address }}"
          fi
          
          echo "=== KALAU GAGAL, PAKE VERIFY MANUAL ==="
