name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'sikabayan'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Step 2 - Create Wallet Baru + Derive Address
        working-directory: scripts
        run:  |
          rm -rf ~/.openclaw/billions/kms.json
          node createNewEthereumIdentity.js

          node -e "
          const { Wallet } = require('ethers');
          const fs = require('fs');
          const kmsPath = process.env.HOME + '/.openclaw/billions/kms.json';
          const kms = JSON.parse(fs.readFileSync(kmsPath, 'utf8'));

          let pk = kms[0]?.data?.key || kms[0]?.privateKeyHex || kms[0]?.privateKey;
          if (!pk) throw new Error('Private key tidak ketemu di kms.json');
          if (!pk.startsWith('0x')) pk = '0x' + pk;

          const wallet = new Wallet(pk);

          const output = 'Agent: ${{ github.event.inputs.agent_name }}\nAddress: ' + wallet.address + '\nPrivate Key: ' + wallet.privateKey;
          fs.writeFileSync('../wallet.txt', output);

          console.log('=== BACKUP WAJIB ===');
          console.log(output);
          console.log('=== BACKUP WAJIB ===');
          "

      - name: Save Wallet as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-${{ github.event.inputs.agent_name }}
          path: wallet.txt
          retention-days: 90

      - name: Step 3 - Generate Link Panjang i_m 24 Jam
        working-directory: scripts
        run:  |
          echo "Generating long link i_m..."
          
          SHORT_URL=$(node manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_name }} AI Agent"}' | grep -o 'https://wallet.billions.network#request_uri=https://[^ ]*')
          
          echo "Short URL: $SHORT_URL"
          
          FETCH_URL=$(echo "$SHORT_URL" | sed 's/.*request_uri=//')
          echo "Fetching JSON from: $FETCH_URL"
          
          REQUEST_JSON=$(curl -s "$FETCH_URL")
          
          if [ -z "$REQUEST_JSON" ]; then
            echo "Gagal fetch JSON dari shortener. Coba Run ulang."
            exit 1
          fi
          
          ENCODED=$(echo -n "$REQUEST_JSON" | base64 | tr '+/' '-_' | tr -d '=')
          
          echo ""
          echo "=== LINK PANJANG 24 JAM ==="
          echo "https://wallet.billions.network/#i_m=$ENCODED"
          echo "=== COPY FULL LINK DI ATAS ==="
