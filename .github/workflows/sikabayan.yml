name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'sikabayan'
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Step 2 - Create Wallet Baru + Derive Address
        working-directory: scripts
        run:  |
          rm -rf ~/.openclaw/billions/kms.json
          node createNewEthereumIdentity.js

          node -e "
          const { Wallet } = require('ethers');
          const fs = require('fs');
          const kmsPath = process.env.HOME + '/.openclaw/billions/kms.json';
          const kms = JSON.parse(fs.readFileSync(kmsPath, 'utf8'));

          let pk = kms[0]?.data?.key || kms[0]?.privateKeyHex || kms[0]?.privateKey;
          if (!pk) throw new Error('Private key tidak ketemu di kms.json');
          if (!pk.startsWith('0x')) pk = '0x' + pk;

          const wallet = new Wallet(pk);

          const output = 'Agent: ${{ github.event.inputs.agent_name }}\nAddress: ' + wallet.address + '\nPrivate Key: ' + wallet.privateKey;
          fs.writeFileSync('../wallet.txt', output);

          console.log('=== BACKUP WAJIB ===');
          console.log(output);
          console.log('=== BACKUP WAJIB ===');
          "

      - name: Save Wallet as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-${{ github.event.inputs.agent_name }}
          path: wallet.txt
          retention-days: 90

      - name: Step 3 - Generate Link Panjang i_m 24 Jam
        working-directory: scripts
        run:  |
          echo "Generating long link i_m..."

          cat > gen_link.js << 'EOF'
          const agentName = process.env.AGENT_NAME;

          let captured = '';
          const originalWrite = process.stdout.write;
          process.stdout.write = (chunk) => {
            captured += chunk;
            return true;
          };

          process.argv = ['node', 'manualLinkHumanToAgent.js', '--challenge', JSON.stringify({name: agentName, description: agentName + ' AI Agent'})];

          require('./manualLinkHumanToAgent.js');

          setTimeout(() => {
            const match = captured.match(/\{.*"id".*"thid".*"body".*\}/s);
            if (!match) {
              console.error('Gagal capture request JSON. Cek output:', captured);
              process.exit(1);
            }

            const requestJson = match[0];
            const encoded = Buffer.from(requestJson).toString('base64url');

            console.error('');
            console.error('=== LINK PANJANG 24 JAM ===');
            console.error('https://wallet.billions.network/#i_m=' + encoded);
            console.error('=== COPY FULL LINK DI ATAS ===');
            console.error('Link valid 24 jam dari sekarang');
            console.error('');
          }, 2000);
          EOF

          AGENT_NAME="${{ github.event.inputs.agent_name }}" node gen_link.js
